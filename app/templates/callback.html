{% extends "base.html" %}
{% block title %}Liaison Spotify · {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto rounded-xl border border-rose-800 bg-rose-950/30 p-6">
  <h1 class="text-lg font-semibold text-white mb-2">La liaison a échoué</h1>
  <p class="text-sm text-rose-200 break-words">{{ error }}</p>
  {% if hint %}<p class="mt-3 text-sm text-amber-200">{{ hint }}</p>{% endif %}
  <div class="mt-5 flex gap-2">
    <a href="/settings" class="rounded-md bg-slate-800 hover:bg-slate-700 text-sm px-4 py-2">Réglages</a>
    <a href="/auth" class="rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-2">Réessayer</a>
  </div>
</div>
{% endblock %}
