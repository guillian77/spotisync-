{% extends "base.html" %}
{% block title %}Bibliothèque · {{ app_name }}{% endblock %}
{% block content %}
<div class="flex flex-wrap items-end justify-between gap-3 mb-5">
  <div>
    <h1 class="text-xl font-semibold text-white">Bibliothèque</h1>
  </div>
  <div class="flex gap-2">
    <form method="post" action="/library/scan">
      <button class="rounded-md bg-slate-800 hover:bg-slate-700 text-sm px-4 py-2">Indexer le dossier musique</button>
    </form>
  </div>
</div>

<form method="get" action="/library" class="flex flex-wrap items-center gap-2 mb-5 text-sm"
      hx-get="/library" hx-target="#library-results" hx-swap="innerHTML"
      hx-push-url="true" hx-indicator="#lib-spin">
  <input name="q" value="{{ q }}" placeholder="Titre, artiste, album…" autocomplete="off"
         class="flex-1 min-w-48 rounded-md bg-slate-800 border border-slate-700 px-3 py-2"
         hx-get="/library" hx-trigger="input changed delay:350ms, search"
         hx-target="#library-results" hx-swap="innerHTML" hx-include="closest form"
         hx-push-url="true" hx-indicator="#lib-spin" hx-sync="closest form:replace">
  <select name="status" class="rounded-md bg-slate-800 border border-slate-700 px-3 py-2"
          hx-get="/library" hx-trigger="change"
          hx-target="#library-results" hx-swap="innerHTML" hx-include="closest form"
          hx-push-url="true" hx-indicator="#lib-spin" hx-sync="closest form:replace">
    <option value="">Tous les statuts</option>
    {% for s in ['pending','queued','running','done','dupe','error'] %}
    <option value="{{ s }}" {{ 'selected' if status == s }}>{{ status_label(s) }}</option>
    {% endfor %}
  </select>
  <span id="lib-spin" class="htmx-indicator text-xs text-slate-500">recherche…</span>
  <button class="rounded-md bg-slate-700 hover:bg-slate-600 px-4 py-2">Filtrer</button>
</form>


<div id="library-results">
  {% include "_library_results.html" %}
</div>
{% endblock %}
