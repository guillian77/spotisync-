services:
  spotisync:
    build: .
    image: spotisync:latest
    container_name: spotisync
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PUID=99
      - PGID=100
      - TZ=Europe/Paris
      # Optionnel : préremplir l'app Spotify (modifiable ensuite dans l'UI)
      # - SPOTIFY_CLIENT_ID=
      # - SPOTIFY_REDIRECT_URI=http://192.168.1.10:8080/callback
      - SPOTISYNC_PORT=8080
    volumes:
      - /mnt/user/appdata/spotisync:/config
      - /mnt/user/music:/music
    # Le téléchargement passe par YouTube : on garde un /dev/shm correct
    shm_size: 256m
